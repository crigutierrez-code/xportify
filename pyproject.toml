[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xportify"
version = "0.1.0"
description = "Convierte tus listas de Spotify (CSV/Excel/URL) a MP3 con búsqueda en YouTube/YouTube Music"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cristian"}
]
dependencies = [
    "PySide6>=6.7.0",
    "yt-dlp>=2024.10.22",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "httpx>=0.27.0",
    "ytmusicapi>=1.8.0",
]

[project.scripts]
xportify = "xportify.main:main"
xportify-cli = "xportify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xportify"]
