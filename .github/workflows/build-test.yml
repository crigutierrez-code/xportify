name: Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Quick syntax check
        run: |
          python -m py_compile $(find src -name "*.py")

      - name: Test imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PYTHONPATH=src python -c "import xportify; print('ok', xportify.__version__)"
