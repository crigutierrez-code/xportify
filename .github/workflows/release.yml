name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            out: Xportify-Linux-x86_64.tar.gz
            sha: SHA256SUMS-linux.txt
          - os: windows-latest
            name: windows
            out: Xportify-Windows-x64.zip
            sha: SHA256SUMS-windows.txt
          - os: macos-latest
            name: macos
            out: Xportify-macOS.zip
            sha: SHA256SUMS-macos.txt

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0 libxcb-xkb1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux
        if: matrix.os == 'ubuntu-22.04'
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Xportify --add-data "assets:assets" --paths src --collect-submodules xportify --collect-all PySide6 --collect-all pandas --collect-all openpyxl --collect-all ytmusicapi --collect-all yt_dlp --collect-all httpx main.py
          cd dist
          cp ../Xportify.desktop Xportify/ 2>/dev/null || true
          cp ../xportify Xportify/ 2>/dev/null || true
          cp ../install-xportify.sh Xportify/ 2>/dev/null || true
          cp ../assets/xportify.png Xportify/ 2>/dev/null || true
          cp ../README.md Xportify/ 2>/dev/null || true
          tar czf ../${{ matrix.out }} Xportify
          cd ..
          sha256sum ${{ matrix.out }} > ${{ matrix.sha }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Xportify --icon assets/icon.ico --add-data "assets;assets" --paths src --collect-submodules xportify --collect-all PySide6 --collect-all pandas --collect-all openpyxl --collect-all ytmusicapi --collect-all yt_dlp --collect-all httpx main.py
          Set-Location dist
          Compress-Archive -Path "Xportify" -DestinationPath "../${{ matrix.out }}" -Force
          Set-Location ..
          $h = (Get-FileHash -Algorithm SHA256 ${{ matrix.out }}).Hash.ToLower()
          "$h  ${{ matrix.out }}" | Out-File -Encoding ascii ${{ matrix.sha }}

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        working-directory: ${{ github.workspace }}
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Xportify --icon assets/icon.icns --add-data "assets:assets" --paths src --collect-submodules xportify --collect-all PySide6 --collect-all pandas --collect-all openpyxl --collect-all ytmusicapi --collect-all yt_dlp --collect-all httpx main.py
          cd dist
          ditto -c -k --keepParent Xportify.app ../${{ matrix.out }}
          cd ..
          shasum -a 256 ${{ matrix.out }} > ${{ matrix.sha }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.out }}
            ${{ matrix.sha }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -lh out/

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          prerelease: false
