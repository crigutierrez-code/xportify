name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Xportify --add-data "assets:assets" --paths src --hidden-import yt_dlp --hidden-import ytmusicapi --hidden-import pandas --hidden-import openpyxl --hidden-import httpx --collect-all yt_dlp --collect-all ytmusicapi main.py
          cd dist
          cp ../Xportify.desktop Xportify/ 2>/dev/null || true
          cp ../xportify Xportify/ 2>/dev/null || true
          cp ../install-xportify.sh Xportify/ 2>/dev/null || true
          cp ../assets/xportify.png Xportify/ 2>/dev/null || true
          cp ../assets/xportify-logo.png Xportify/ 2>/dev/null || true
          cp ../README.md Xportify/ 2>/dev/null || true
          tar czf Xportify-Linux-x86_64.tar.gz Xportify
          sha256sum Xportify-Linux-x86_64.tar.gz > ../SHA256SUMS-linux.txt
          cd ..

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Xportify --icon assets/icon.ico --add-data "assets;assets" --paths src --hidden-import yt_dlp --hidden-import ytmusicapi --hidden-import pandas --hidden-import openpyxl --hidden-import httpx --collect-all yt_dlp --collect-all ytmusicapi main.py
          cd dist
          7z a -tzip Xportify-Windows-x64.zip Xportify
          certutil -hashfile Xportify-Windows-x64.zip SHA256 | findstr /v "CertUtil" > ../SHA256SUMS-windows.txt
          cd ..

      - name: Build with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Xportify --icon assets/icon.icns --add-data "assets:assets" --paths src --hidden-import yt_dlp --hidden-import ytmusicapi --hidden-import pandas --hidden-import openpyxl --hidden-import httpx --collect-all yt_dlp --collect-all ytmusicapi main.py
          cd dist
          ditto -c -k --keepParent Xportify.app Xportify-macOS.zip 2>/dev/null || zip -r Xportify-macOS.zip Xportify.app
          shasum -a 256 Xportify-macOS.zip > ../SHA256SUMS-macos.txt
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xportify-${{ matrix.name }}
          path: |
            Xportify-*.tar.gz
            Xportify-*.zip
            SHA256SUMS-*.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Xportify-Linux-x86_64.tar.gz
            Xportify-Windows-x64.zip
            Xportify-macOS.zip
            SHA256SUMS-linux.txt
            SHA256SUMS-windows.txt
            SHA256SUMS-macos.txt
          fail_on_unmatched_files: false
